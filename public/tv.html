<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Party — TV</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/games.css">
  <link rel="stylesheet" href="/responsive.css">
  <link rel="stylesheet" href="/fx.css">
</head>
<body class="tv">
  <div class="tv-app">
    <header class="tv-head">
      <div class="brand"><span class="ufo" id="brandIcon">🎉</span> <span id="brandName"></span></div>
      <div class="phase-box">
        <div class="phase-title" id="phaseTitle"></div>
        <div class="phase-sub" id="phaseSub"></div>
      </div>
      <div class="timer js-timer" id="timer"></div>
      <aside class="cup hidden" id="cup"></aside>
      <div class="room-chip" id="roomChip"></div>
    </header>
    <main class="tv-main" id="main"></main>
    <footer class="strip" id="strip"></footer>
  </div>
  <div class="react-layer" id="reactLayer"></div>
  <div class="phase-banner" id="phaseBanner"></div>
  <button class="sound-btn" id="soundBtn">🔊</button>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/art-images.js"></script>
  <script src="/js/art.js"></script>
  <script src="/js/art2.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/canvas.js"></script>
  <script src="/js/ships.js"></script>
  <script src="/games/alien.tv.js"></script>
  <script src="/games/sniper.tv.js"></script>
  <script src="/games/croc.tv.js"></script>
  <script src="/games/battleship.tv.js"></script>
  <script src="/games/doodle.tv.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
